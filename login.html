<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 p-8 rounded-2xl border border-slate-700 space-y-6">
    <div class="text-center">
      <h2 class="text-2xl font-bold text-white">Admin Panelga Kirish</h2>
      <p class="text-slate-400 text-sm mt-1">Portfolio ma'lumotlarini boshqarish</p>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs text-slate-400 mb-1">Login</label>
        <input type="text" id="username" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-teal-400">
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Parol</label>
        <input type="password" id="password" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-teal-400">
      </div>

      <div id="error-msg" class="text-red-400 text-sm hidden"></div>

      <button type="submit" class="w-full bg-teal-500 hover:bg-teal-600 text-slate-950 font-bold py-2.5 rounded-lg transition">
        Kirish
      </button>
    </form>

    <div class="text-center">
      <a href="/" class="text-sm text-slate-400 hover:text-slate-200">← Asosiy saytga qaytish</a>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('adminToken', data.token);
          window.location.href = '/admin';
        } else {
          errorMsg.innerText = data.message || 'Xatolik yuz berdi';
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.innerText = 'Serverga ulanishda xatolik!';
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
